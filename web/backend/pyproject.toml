[project]
name = "village-backend"
version = "0.1.0"
description = "Local FastAPI backend for Our AI-Powered Smart Green Village"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.136.1",
  "uvicorn[standard]==0.46.0",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "python-multipart==0.0.33",
  "aiosqlite==0.22.1",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.4.1.post1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
