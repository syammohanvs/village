[platformio]
default_envs = esp32doit-devkit-v1
src_dir = src
include_dir = include
test_dir = test

[env:esp32doit-devkit-v1]
; 30-pin NodeMCU-style ESP32-WROOM-32 DevKit V1, 4 MB flash.
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -std=gnu++17
build_unflags =
  -std=gnu++11

[env:esp32doit-devkit-v1-ota]
; Same firmware, delivered over Wi-Fi to a board already running OTA.
; The password is the one in uc/include/village/secrets.h; export it first:
;   export VILLAGE_OTA_PASSWORD="$(sed -n 's/.*VILLAGE_OTA_PASSWORD "\(.*\)"/\1/p' uc/include/village/secrets.h)"
;   pio run -e esp32doit-devkit-v1-ota -t upload --upload-port 192.168.1.8
extends = env:esp32doit-devkit-v1
upload_protocol = espota
upload_flags =
  --auth=${sysenv.VILLAGE_OTA_PASSWORD}

[env:native]
; Host-side tests for the portable safety core.  The canonical runner is
; scripts/test_firmware.sh (g++), which needs no internet or PlatformIO.
platform = native
test_framework = custom
test_build_src = no
build_flags = -std=gnu++17 -I include
